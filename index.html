<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:sans-serif;background:#1a1a1a;}
nav{background:#111;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #E24B4A;}
.logo{font-size:18px;font-weight:500;color:#fff;letter-spacing:2px;}
.links a{font-size:13px;color:#888;text-decoration:none;letter-spacing:1px;text-transform:uppercase;margin-left:24px;}
.links a:hover{color:#E24B4A;}
.hero{padding:4rem 2rem;text-align:center;}
.tag{font-size:11px;letter-spacing:3px;color:#E24B4A;text-transform:uppercase;margin-bottom:1rem;}
h1{font-size:42px;font-weight:500;color:#fff;line-height:1.2;margin-bottom:1rem;}
h1 span{color:#E24B4A;}
.sub{font-size:14px;color:#888;max-width:400px;margin:0 auto 2rem;line-height:1.7;}
.btn{background:#E24B4A;color:#fff;border:none;padding:12px 32px;font-size:13px;letter-spacing:2px;text-transform:uppercase;border-radius:4px;cursor:pointer;}
.divider{height:1px;background:#333;margin:0 2rem;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#333;}
.stat{background:#1a1a1a;padding:1.5rem;text-align:center;}
.stat-num{font-size:28px;font-weight:500;color:#E24B4A;}
.stat-label{font-size:11px;color:#666;letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
footer{background:#111;padding:1rem 2rem;text-align:center;}
footer p{font-size:11px;color:#444;letter-spacing:1px;}
</style>
</head>
<body>
<nav><div class="logo">GAG</div><div class="links"><a href="#">About</a><a href="#">Work</a><a href="#">Contact</a></div></nav>
<div class="hero"><div class="tag">Professional Services</div><h1>We Build <span>Solutions</span><br>That Matter</h1><p class="sub">Clean, modern, and powerful. Designed to make an impact.</p><button class="btn">Get Started</button></div>
<div class="divider"></div>
<div class="stats"><div class="stat"><div class="stat-num">100+</div><div class="stat-label">Projects</div></div><div class="stat"><div class="stat-num">50+</div><div class="stat-label">Clients</div></div><div class="stat"><div class="stat-num">5+</div><div class="stat-label">Years</div></div></div>
<footer><p>© 2026 GAG — All rights reserved</p></footer>
</body>
</html>
